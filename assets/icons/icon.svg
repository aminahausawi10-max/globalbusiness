<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 512 512 width=512 height=512>
  <defs>
    <linearGradient id=bgGrad x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#0F172A/>
      <stop offset=50% stop-color=#064E3B/>
      <stop offset=100% stop-color=#059669/>
    </linearGradient>
    <linearGradient id=goldGrad x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#FDE047/>
      <stop offset=100% stop-color=#F59E0B/>
    </linearGradient>
    <filter id=glow x=-20% y=-20% width=140% height=140%>
      <feDropShadow dx=0 dy=8 stdDeviation=12 flood-color=#059669 flood-opacity=0.5/>
    </filter>
  </defs>
  <!-- App Background -->
  <rect width=512 height=512 rx=110 fill=url(#bgGrad)/>
  <!-- Inner Border Highlight -->
  <rect x=16 y=16 width=480 height=480 rx=96 fill=none stroke=rgba(255,255,255,0.15) stroke-width=4/>
  <!-- Center Shopping Bag & Globe Symbol -->
  <g filter=url(#glow) transform=translate(106, 96)>
    <!-- Bag Handle -->
    <path d=M 80 110 C 80 50, 220 50, 220 110 fill=none stroke=url(#goldGrad) stroke-width=22 stroke-linecap=round/>
    <!-- Bag Body -->
    <path d=M 40 110 L 260 110 L 280 290 C 280 305, 268 316, 252 316 L 48 316 C 32 316, 20 305, 20 290 Z fill=#10B981 stroke=#34D399 stroke-width=6/>
    <!-- Globe Lines on Bag -->
    <circle cx=150 cy=216 r=54 fill=none stroke=#FFFFFF stroke-width=10 stroke-opacity=0.9/>
    <ellipse cx=150 cy=216 rx=26 ry=54 fill=none stroke=#FFFFFF stroke-width=8 stroke-opacity=0.9/>
    <line x1=96 y1=216 x2=204 y2=216 stroke=#FFFFFF stroke-width=8 stroke-opacity=0.9/>
    <line x1=108 y1=186 x2=192 y2=186 stroke=#FFFFFF stroke-width=7 stroke-opacity=0.75/>
    <line x1=108 y1=246 x2=192 y2=246 stroke=#FFFFFF stroke-width=7 stroke-opacity=0.75/>
  </g>
  <!-- Text Label -->
  <text x=256 y=456 font-family='Plus Jakarta Sans', system-ui, sans-serif font-weight=900 font-size=38 fill=#FFFFFF text-anchor=middle letter-spacing=4>GLOBALBIZ</text>
</svg>
